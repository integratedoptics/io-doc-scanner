plugins { id 'com.android.application' }

android {
    namespace 'lt.elmo.cardscanner'
    compileSdk 34

    defaultConfig {
        applicationId "lt.elmo.cardscanner"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
        resConfigs "en"
        ndk {
            // Samsung phones are ARM; dropping the x86 emulator libraries
            // removes ~23 MB from the APK.
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            storeFile file("../keystore/cardscanner.jks")
            storePassword "cardscanner"
            keyAlias "cardscanner"
            keyPassword "cardscanner"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module']
    }
}

// ML Kit pulls in an old kotlin-stdlib-jdk7/8 pair that collides with the
// current kotlin-stdlib; align them all on one version.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
